name: Smoke run (temporary, never merged)

on:
  push:
    branches: [smoke/linux-run]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    services:
      # Upstream's local-lab GreenMail account (tools/local-lab/compose.yaml): plaintext IMAP 3143, SMTP 3025.
      greenmail:
        image: greenmail/standalone:2.1.8
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=dave:Smoke-Pw-4711x@greenmail.test -Dgreenmail.users.login=email
        ports: ["3143:3143", "3025:3025"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Desktop libraries, virtual screen, keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libgtk-4-1 libadwaita-1-0 libsecret-1-0 gnome-keyring libglib2.0-bin dbus-x11 xvfb imagemagick x11-utils xdotool openbox
          cat /etc/os-release | grep PRETTY; dpkg -l | grep -E "libadwaita-1-0|libgtk-4-1 " | awk '{print $2, $3}'
      - name: Publish
        run: |
          dotnet publish src/Wino.Mail.Linux/Wino.Mail.Linux.csproj -c Debug -r linux-x64 -o run
          dotnet publish src/Wino.Mail.Linux/Wino.Mail.Linux.csproj -c Release -r linux-x64 -p:WinoLinuxNativeAot=true -p:TreatWarningsAsErrors=false -o aot
      - name: Seed the test mailbox
        run: |
          python3 - <<'PY'
          import smtplib, time
          from email.message import EmailMessage
          for attempt in range(30):
              try:
                  s = smtplib.SMTP('127.0.0.1', 3025, timeout=5); break
              except OSError: time.sleep(2)
          for i in range(1, 6):
              m = EmailMessage(); m['From'] = 'Alice Lab <alice@example.test>'; m['To'] = 'dave@greenmail.test'
              m['Subject'] = f'Smoke message {i}'; m.set_content(f'Body of smoke message {i}.')
              s.send_message(m)
          s.quit(); print('seeded 5 messages')
          # Older mail straight into the Inbox, for the date groups, read and flag marks, an attachment and paging.
          import imaplib, email.utils, datetime
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.application import MIMEApplication
          imap = imaplib.IMAP4('127.0.0.1', 3143); imap.login('dave@greenmail.test', 'Smoke-Pw-4711x')
          now = datetime.datetime.now(datetime.timezone.utc)
          senders = ['GitHub <notifications@github.com>', 'Carol Lab <carol@example.test>', 'Newsletter <news@example.test>', 'AT&T Billing <billing@att.example>']
          count = 0
          for days in [1, 1, 2, 3, 5, 9, 16, 30, 45, 70] + list(range(80, 160, 2)):
              when = now - datetime.timedelta(days=days, hours=count % 7)
              sender = senders[count % len(senders)]
              if count == 2:
                  m = MIMEMultipart(); m.attach(MIMEText('The report is attached.'))
                  part = MIMEApplication(b'%PDF-1.4 smoke', Name='report.pdf'); part['Content-Disposition'] = 'attachment; filename="report.pdf"'; m.attach(part)
                  subject = 'Quarterly report with attachment'
              else:
                  m = MIMEText(f'Older message {count} body text with a little preview.'); subject = f'Older message {count} from {days} days ago'
              m['From'] = sender; m['To'] = 'dave@greenmail.test'; m['Subject'] = subject; m['Date'] = email.utils.format_datetime(when)
              m['Message-ID'] = email.utils.make_msgid(domain='example.test')
              flags = '(\\Seen)' if count % 3 else ''
              if count == 1: flags = '(\\Flagged)'
              imap.append('INBOX', flags, imaplib.Time2Internaldate(when), m.as_bytes()); count += 1
          imap.create('Archive'); imap.logout(); print(f'appended {count} older messages, created Archive')
          PY
      - name: Run under a virtual screen
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          dbus-run-session -- bash -c '
            echo -n "smoke" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            Xvfb :99 -screen 0 1280x800x24 & export DISPLAY=:99; sleep 2; openbox & sleep 1
            ( ./run/WinoLux > app.out 2>&1; echo "exit code $?" >> app.out ) &
            sleep 25
            import -window root screen-first.png
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- second launch (existing installation)"
            ( ./run/WinoLux > app2.out 2>&1; echo "exit code $?" >> app2.out ) &
            sleep 15
            import -window root screen-second.png
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- third launch (Native AOT, existing installation)"
            ( ./aot/WinoLux > app3.out 2>&1; echo "exit code $?" >> app3.out ) &
            sleep 12
            import -window root screen-aot.png
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- fourth launch (Debug): IMAP onboarding against GreenMail"
            rm -rf "$HOME/.local/share/WinoLux" "$HOME/.config/WinoLux" "$HOME/.cache/WinoLux"
            ( ./run/WinoLux > app4.out 2>&1; echo "exit code $?" >> app4.out ) &
            sleep 20
            D="$HOME/.cache/WinoLux/debug"
            cmd() { local before; before=$(wc -l < "$D/out.log" 2>/dev/null || echo 0); echo "$*" > "$D/cmd"
              for i in $(seq 1 ${WAIT:-60}); do [ "$(wc -l < "$D/out.log" 2>/dev/null || echo 0)" -gt "$before" ] && break; sleep 1; done; tail -n 1 "$D/out.log"; }
            shot() { sleep 2; import -window root "$1.png"; }
            cmd commands
            shot onb-1-welcome
            cmd welcome-start; sleep 2
            cmd provider-state
            cmd provider IMAP4
            cmd provider-continue
            cmd provider-name Smoke Lab
            shot onb-2-identity
            cmd provider-continue
            cmd provider-capability calendar off
            cmd provider-capability contacts off
            cmd provider-capability tasks off
            cmd provider-state
            shot onb-2b-capabilities
            cmd provider-continue; sleep 2
            cmd page
            cmd imap-state
            cmd imap-identity Dave Lab dave@greenmail.test
            cmd imap-state
            shot onb-3-imap
            cmd focus imap-password && xdotool type --delay 50 "Smoke-Pw-4711x"
            shot onb-4-signin
            WAIT=120 cmd imap-continue
            cmd imap-incoming 127.0.0.1 3143 3 2
            cmd imap-outgoing 127.0.0.1 3025 3 1
            cmd imap-state
            shot onb-5-servers
            WAIT=180 cmd imap-continue
            for i in 1 2 3 4 5 6; do cmd page; cmd setup-state; cmd imap-state; sleep 5; done
            shot onb-6-after-add
            sleep 15; cmd page; shot onb-7-shell
            echo "--- shell checks"
            cmd shell-state
            shot sh-1-large
            cmd folder Inbox; sleep 2; cmd shell-state
            cmd mode Calendar; sleep 1; shot sh-2-mode-toast; cmd shell-state
            W=$(xdotool search --name "WinoLux" | head -1); echo "window $W"
            echo "--- sender pictures: Skia libraries and the picture cache"
            ls run aot | grep -i skia || echo "no Skia library"
            find "$HOME/.local/share/WinoLux" -type f \( -iname "*.jpg" -o -iname "*.png" -o -iname "*.webp" \) -printf "%s %p\n" | head
            echo "--- mail list checks"
            WAIT=90 cmd mail-state; sleep 10; cmd mail-state
            shot ml-1-list
            cmd mail-select 0; sleep 3; cmd mail-state; shot ml-2-selected
            cmd mail-select 1 3; sleep 2; cmd mail-state
            xdotool mousemove 500 420; for i in $(seq 1 60); do xdotool click 5; sleep 0.05; done; sleep 4; cmd mail-state; shot ml-3-scrolled
            cmd shell-state; cmd folder Archive; sleep 4; cmd mail-state; shot ml-4-empty-folder
            cmd folder Inbox; sleep 4; cmd mail-state
            cmd window-size 900 700; sleep 3; cmd shell-state; shot sh-3-medium
            cmd sidebar-toggle; sleep 2; shot sh-4-medium-overlay; cmd shell-state
            cmd folder Inbox; sleep 2; cmd shell-state; shot sh-4b-medium-after-pick
            cmd window-size 560 700; sleep 3; cmd shell-state; shot sh-5-small
            cmd window-size 1100 720; sleep 3; cmd shell-state
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- security: files containing the password (expect none)"; grep -rlaF "Smoke-Pw-4711x" "$HOME/.local/share/WinoLux" "$HOME/.config/WinoLux" "$HOME/.cache/WinoLux" || echo "none"
            echo "--- security: password references in the database"; grep -aoE "wino-keychain:v1:[A-Za-z0-9:_-]{0,40}" "$HOME"/.local/share/WinoLux/data/Wino*.db | sort -u | head
            echo "--- security: modes"; stat -c "%a %n" "$HOME/.local/share/WinoLux" "$HOME/.local/share/WinoLux/data" "$HOME/.local/share/WinoLux/secure" "$HOME/.config/WinoLux" "$HOME/.cache/WinoLux"; ls -la "$HOME/.local/share/WinoLux/secure" | head
            echo "--- fifth launch (Debug, dark): the shell with the account"
            ( ADW_DEBUG_COLOR_SCHEME=prefer-dark ./run/WinoLux > app5.out 2>&1; echo "exit code $?" >> app5.out ) &
            sleep 20; cmd page; cmd shell-state; shot sh-6-dark
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- output 5"; cat app5.out
            echo "--- sixth launch (Native AOT): the shell and message list with the account"
            ( ./aot/WinoLux > app6.out 2>&1; echo "exit code $?" >> app6.out ) &
            sleep 20; shot ml-5-aot
            xdotool mousemove 500 300 click 1; sleep 3; shot ml-6-aot-click
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- output 6"; cat app6.out
            echo "--- bridge log"; cat "$D/out.log"; echo "--- output 4"; cat app4.out; echo "--- accounts db"; ls -la "$HOME/.local/share/WinoLux/data"
            echo "--- onboarding log"; grep -hiE "error|warn|exception|imap|account|sync|folder" "$HOME"/.local/share/WinoLux/data/Logs/*.log | tail -n 80
            for f in sh-*.png ml-*.png; do convert "$f" -resize 50% -colors 64 "small-$f"; echo "PNGB64 $f $(base64 -w0 small-$f)"; done
            echo "--- output"; cat app.out; echo "--- output 2"; cat app2.out; echo "--- output 3"; cat app3.out
            echo "--- files"; find "$HOME" -path "*/WinoLux*" | head -40
            echo "--- log"; tail -n 80 "$HOME"/.local/share/WinoLux/data/Logs/*.log 2>/dev/null || true
            for f in screen-first.png screen-second.png screen-aot.png; do convert "$f" -resize 50% -colors 64 "small-$f"; echo "PNGB64 $f $(base64 -w0 small-$f)"; done
          '
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke
          path: "*.png"
