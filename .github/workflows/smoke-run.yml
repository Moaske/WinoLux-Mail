name: Smoke run (temporary, never merged)

on:
  push:
    branches: [smoke/linux-run]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    services:
      # Upstream's local-lab GreenMail account (tools/local-lab/compose.yaml): plaintext IMAP 3143, SMTP 3025.
      greenmail:
        image: greenmail/standalone:2.1.8
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=dave:1@greenmail.test -Dgreenmail.users.login=email
        ports: ["3143:3143", "3025:3025"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Desktop libraries, virtual screen, keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libgtk-4-1 libadwaita-1-0 libsecret-1-0 gnome-keyring libglib2.0-bin dbus-x11 xvfb imagemagick x11-utils xdotool
          cat /etc/os-release | grep PRETTY; dpkg -l | grep -E "libadwaita-1-0|libgtk-4-1 " | awk '{print $2, $3}'
      - name: Publish
        run: |
          dotnet publish src/Wino.Mail.Linux/Wino.Mail.Linux.csproj -c Debug -r linux-x64 -o run
          dotnet publish src/Wino.Mail.Linux/Wino.Mail.Linux.csproj -c Release -r linux-x64 -p:WinoLinuxNativeAot=true -p:TreatWarningsAsErrors=false -o aot
      - name: Seed the test mailbox
        run: |
          python3 - <<'PY'
          import smtplib, time
          from email.message import EmailMessage
          for attempt in range(30):
              try:
                  s = smtplib.SMTP('127.0.0.1', 3025, timeout=5); break
              except OSError: time.sleep(2)
          for i in range(1, 6):
              m = EmailMessage(); m['From'] = 'Alice Lab <alice@example.test>'; m['To'] = 'dave@greenmail.test'
              m['Subject'] = f'Smoke message {i}'; m.set_content(f'Body of smoke message {i}.')
              s.send_message(m)
          s.quit(); print('seeded 5 messages')
          PY
      - name: Run under a virtual screen
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          dbus-run-session -- bash -c '
            echo -n "smoke" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            Xvfb :99 -screen 0 1280x800x24 & export DISPLAY=:99; sleep 2
            ( ./run/WinoLux > app.out 2>&1; echo "exit code $?" >> app.out ) &
            sleep 25
            import -window root screen-first.png
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- second launch (existing installation)"
            ( ./run/WinoLux > app2.out 2>&1; echo "exit code $?" >> app2.out ) &
            sleep 15
            import -window root screen-second.png
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- third launch (Native AOT, existing installation)"
            ( ./aot/WinoLux > app3.out 2>&1; echo "exit code $?" >> app3.out ) &
            sleep 12
            import -window root screen-aot.png
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- fourth launch (Debug): IMAP onboarding against GreenMail"
            rm -rf "$HOME/.local/share/WinoLux" "$HOME/.config/WinoLux" "$HOME/.cache/WinoLux"
            ( ./run/WinoLux > app4.out 2>&1; echo "exit code $?" >> app4.out ) &
            sleep 20
            D="$HOME/.cache/WinoLux/debug"
            cmd() { local before; before=$(wc -l < "$D/out.log" 2>/dev/null || echo 0); echo "$*" > "$D/cmd"
              for i in $(seq 1 ${WAIT:-60}); do [ "$(wc -l < "$D/out.log" 2>/dev/null || echo 0)" -gt "$before" ] && break; sleep 1; done; tail -n 1 "$D/out.log"; }
            shot() { sleep 2; import -window root "$1.png"; }
            cmd commands
            shot onb-1-welcome
            cmd welcome-start; sleep 2
            cmd provider-state
            cmd provider IMAP4
            cmd provider-name Smoke Lab
            cmd provider-capability calendar off
            cmd provider-capability contacts off
            cmd provider-capability tasks off
            cmd provider-state
            shot onb-2-provider
            cmd provider-continue; sleep 2
            cmd page; cmd imap-state
            cmd imap-identity Dave Lab dave@greenmail.test
            cmd imap-state
            shot onb-3-imap
            cmd focus imap-password && xdotool type --delay 50 "1"
            cmd imap-incoming 127.0.0.1 3143 0 0
            cmd imap-outgoing 127.0.0.1 3025 0 0
            cmd imap-state
            shot onb-4-imap-filled
            WAIT=120 cmd imap-continue
            cmd imap-state
            shot onb-5-after-continue
            sleep 20; cmd setup-state
            shot onb-6-done
            sleep 10; shot onb-7-shell
            gdbus call --session --dest io.github.moaske.WinoLux --object-path /io/github/moaske/WinoLux --method org.gtk.Actions.Activate quit "[]" "{}" >/dev/null || echo "quit action failed"; sleep 6
            echo "--- bridge log"; cat "$D/out.log"; echo "--- output 4"; cat app4.out
            echo "--- onboarding log"; grep -hiE "error|warn|exception|imap|account" "$HOME"/.local/share/WinoLux/data/Logs/*.log | tail -n 80
            for f in onb-*.png; do convert "$f" -resize 50% -colors 64 "small-$f"; echo "PNGB64 $f $(base64 -w0 small-$f)"; done
            echo "--- output"; cat app.out; echo "--- output 2"; cat app2.out; echo "--- output 3"; cat app3.out
            echo "--- files"; find "$HOME" -path "*/WinoLux*" | head -40
            echo "--- log"; tail -n 80 "$HOME"/.local/share/WinoLux/data/Logs/*.log 2>/dev/null || true
            for f in screen-first.png screen-second.png screen-aot.png; do convert "$f" -resize 50% -colors 64 "small-$f"; echo "PNGB64 $f $(base64 -w0 small-$f)"; done
          '
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke
          path: "*.png"
