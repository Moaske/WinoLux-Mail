name: Linux

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and package (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Debug build (shared projects and Linux head)
        run: dotnet build WinoMail.Linux.slnx -c Debug

      - name: Release gate (shared projects; GTK projects exempt here, see the AOT probe)
        run: dotnet build WinoMail.Linux.slnx -c Release -p:WinoGtkAotExempt=true

      - name: Publish linux-x64
        run: dotnet publish src/Wino.Mail.Linux/Wino.Mail.Linux.csproj -c Release -r linux-x64 -p:WinoGtkAotExempt=true -o artifacts/WinoLux

      - name: Pack archive
        run: tar -C artifacts -czf WinoLux-linux-x64.tar.gz WinoLux

      - uses: actions/upload-artifact@v5
        with:
          name: WinoLux-linux-x64
          path: WinoLux-linux-x64.tar.gz
          retention-days: 14

  aot-probe:
    name: Native AOT probe (open item L5)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install the Native AOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Release build of the head with the full AOT gate
        id: gate
        run: |
          set -o pipefail
          dotnet build src/Wino.Mail.Linux/Wino.Mail.Linux.csproj -c Release 2>&1 | tee gate.log

      - name: Native AOT publish
        id: aot
        if: always()
        run: |
          set -o pipefail
          dotnet publish src/Wino.Mail.Linux/Wino.Mail.Linux.csproj -c Release -r linux-x64 -p:WinoLinuxNativeAot=true -p:TreatWarningsAsErrors=false -o aot 2>&1 | tee aot.log
          ls -la aot

      - name: Summary
        if: always()
        run: |
          {
            echo "## Native AOT probe"
            echo
            echo "- AOT gate build: ${{ steps.gate.outcome }}"
            echo "- Native AOT publish: ${{ steps.aot.outcome }}"
            echo
            echo "### Trim and AOT warnings (IL2xxx, IL3xxx)"
            echo '```'
            grep -hoE "warning IL[23][0-9]{3}[^[]*" gate.log aot.log 2>/dev/null | sort | uniq -c | sort -rn | head -40 || true
            echo '```'
            if [ -f aot/WinoLux ]; then echo "Native binary size: $(du -h aot/WinoLux | cut -f1)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
